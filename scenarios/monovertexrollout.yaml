apiVersion: numaplane.numaproj.io/v1alpha1
kind: MonoVertexRollout
metadata:
  name: my-monovertex
  namespace: numaplane-e2e
spec:
  monoVertex:
    spec:
      scale:
        min: 1
        max: 1
      source:
        udsource:
          container:
            image: quay.io/numaio/numaflow-go/source-simple-source:stable
      sink:
        # blackhole: the log sink prints every message and filled the node disk
        blackhole: {}
